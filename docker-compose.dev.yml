# Retained for the legacy Python oracle stack only. The normal Rust desktop
# runtime runs the Rust backend in-process and does not require Docker,
# Postgres, Redis, or MinIO.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ag-swarmer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentchat}
      POSTGRES_DB: ${POSTGRES_DB:-agentchat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ag-swarmer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ag-swarmer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
