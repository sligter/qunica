[package]
name = "qunica-backend"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
# Note: compile the PoC explicitly without enabling an unfinished runtime in releases.
rig-engine = ["dep:rig-core", "dep:rig-agent", "dep:rig-reqwest", "dep:reqwest_013"]

[dependencies]
qunica-domain = { path = "../domain" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
base64 = "0.22"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4", features = ["derive", "env"] }
croner = "3.0.1"
futures-util = "0.3"
globset = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
# The browser build has no native terminal to fall back on, so the server owns
# the PTY. Same version the desktop shell already uses.
portable-pty = "0.9.0"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
# Keep native clients on 0.12; the Rig adapter owns its separate transport.
reqwest_013 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "multipart", "native-tls"], optional = true }
rig-core = { version = "=0.45.0", default-features = false, features = ["image"], optional = true }
rig-agent = { version = "=0.45.0", default-features = false, features = ["image"], optional = true }
rig-reqwest = { version = "=0.45.0", default-features = false, features = ["native-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
# Note: pin the exact float parser in every build. Rig turns it on through
# feature unification, and durable identity digests hash parsed numbers, so a
# build with and without Rig must not disagree. See RIG_MIGRATION.md.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "time", "json", "macros", "migrate"] }
tempfile = "3"
thiserror = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "io-util", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Job objects own a spawned shell's descendants, and `MultiByteToWideChar`
# decodes output from a legacy console code page. See `src/process.rs` and
# `src/tools/shell.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_JobObjects",
] }

# `killpg` reaches a spawned shell's process group. See `src/process.rs`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
qunica-computer-supervisor = { path = "../computer-supervisor" }
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "rig_dependencies"
required-features = ["rig-engine"]
