[package]
name = "qunica-computer-supervisor"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util", "process"] }
