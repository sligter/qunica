[project]
name = "ag-swarmer-backend"
version = "0.1.0"
description = "AgentChat backend - 群式多 Agent 协作工作台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "structlog>=24.4.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-openai>=0.2.10",
    "langchain-anthropic>=0.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "sse-starlette>=2.2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    # FastAPI's Depends() in argument defaults is the documented idiomatic
    # pattern; the "function call in defaults" warning is a false positive
    # here.
    "B008",
    # SQLAlchemy dialect classes are imported with capitalized aliases
    # (e.g. `from sqlalchemy.dialects.postgresql import UUID as PgUUID`);
    # they are classes, not constants.
    "N811",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/.*\\.py$"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
